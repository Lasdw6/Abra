[package]
name = "cadabra"
description = "Abra daemon: holds the device identity, capsule store, outbox and inbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cadabra"
path = "src/main.rs"

[dependencies]
abra-core.workspace = true
abra-net = { path = "../abra-net" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
rand.workspace = true
hex.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
