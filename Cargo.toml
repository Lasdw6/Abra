[workspace]
resolver = "2"
members = ["crates/abra-core", "crates/abra-adapter", "crates/abra-net", "crates/abra-relay", "crates/abra-runtime", "crates/cadabra", "crates/abra-cli", "adapters/firecracker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Lasdw6/Abra"
rust-version = "1.91"

[workspace.dependencies]
abra-core = { path = "crates/abra-core", version = "0.1.0" }
abra-adapter = { path = "crates/abra-adapter", version = "0.1.0" }
abra-net = { path = "crates/abra-net", version = "0.1.0", default-features = false }
abra-relay = { path = "crates/abra-relay", version = "0.1.0" }
abra-runtime = { path = "crates/abra-runtime", version = "0.1.0" }
cadabra = { path = "crates/cadabra", version = "0.1.0", default-features = false }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
data-encoding = "2"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
tempfile = "3"
async-trait = "=0.1.89"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
