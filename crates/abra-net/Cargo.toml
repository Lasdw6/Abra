[package]
name = "abra-net"
description = "Authenticated delivery, pairing, and enrollment for Abra."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Reserved for the iroh 1.x adapter. See DESIGN.md.
iroh = ["dep:iroh"]

[dependencies]
abra-core.workspace = true
async-trait.workspace = true
blake3.workspace = true
data-encoding.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
iroh = { version = "1.1.0", optional = true, default-features = false, features = ["tls-ring"] }

[dev-dependencies]
tempfile.workspace = true
