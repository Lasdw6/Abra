[package]
name = "cadabra"
description = "Abra daemon: holds the device identity, capsule store, outbox and inbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["iroh", "tcp"]
iroh = ["abra-net/iroh"]
tcp = ["abra-net/tcp"]

[[bin]]
name = "cadabra"
path = "src/main.rs"

[dependencies]
abra-core.workspace = true
abra-net = { path = "../abra-net", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "process"] }
rand.workspace = true
hex.workspace = true
fs2 = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
clap.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
